server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors Cloudflare _headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Main app — no cache, always fresh
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker — no cache
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Guest page — no cache
    location = /guest.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Manifest, llms — short cache
    location ~ ^/(manifest\.json|llms\.txt|llms\.html|stats\.html)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Icons — day cache
    location ~ \.(png|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
