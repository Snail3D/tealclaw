<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TealClaw</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --t: 0.2s;
      --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
      --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Code', Menlo, monospace;
      --teal: #0d9488; --teal-dim: rgba(13,148,136,0.12); --teal-hover: #0f766e;
    }
    [data-theme="dark"] {
      --bg-root: #0a0f1a; --bg-1: #0e1320; --bg-card: #121928;
      --bg-hover: #1a2236; --bg-input: #0e1320; --bg-overlay: rgba(0,0,0,0.88);
      --border: #1e2a3e; --border-2: #2e3f5a;
      --text: #e2e8f0; --text-2: #94a3b8; --text-3: #475569;
      --ok: #22c55e; --err: #ef4444; --warn: #f59e0b;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --user-bg: #162033; --ai-bg: #0d1a1a;
    }
    [data-theme="light"] {
      --bg-root: #f1f5f9; --bg-1: #fff; --bg-card: #fff;
      --bg-hover: #f8fafc; --bg-input: #f1f5f9; --bg-overlay: rgba(255,255,255,0.92);
      --border: #e2e8f0; --border-2: #cbd5e1;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --ok: #16a34a; --err: #dc2626; --warn: #d97706;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --user-bg: #eff6ff; --ai-bg: #f0fdfa;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg-root);color:var(--text);font-family:var(--font);min-height:100vh;min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

    /* ── Topbar ────────────────────────────────────────── */
    .topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--bg-1);border-bottom:1px solid var(--border);flex-shrink:0}
    .logo{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--teal);user-select:none}
    .logo svg{width:18px;height:18px}
    .topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
    .pill{display:flex;align-items:center;gap:4px;padding:2px 8px;font-size:10px;font-weight:500;border-radius:100px}
    .pill.ok{background:rgba(34,197,94,0.12);color:var(--ok)} .pill.off{background:rgba(239,68,68,0.12);color:var(--err)}
    .pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
    .icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-card);color:var(--text-2);cursor:pointer;transition:all var(--t)}
    .icon-btn:hover{border-color:var(--border-2);color:var(--text)}
    .icon-btn svg{width:14px;height:14px}

    /* ── Layout ────────────────────────────────────────── */
    .main{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;overflow:hidden}

    /* ── Chat Layout ───────────────────────────────────── */
    .chat-scroll{flex:1;overflow-y:auto;padding:16px}
    .chat-empty{text-align:center;padding:40px 16px;color:var(--text-3);font-size:12px}
    .chat-bubble{max-width:85%;margin-bottom:10px;padding:10px 14px;border-radius:var(--r-lg);font-size:13px;line-height:1.6;word-break:break-word;animation:bubble-in 0.25s ease-out}
    @keyframes bubble-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .chat-bubble.user{background:var(--user-bg);margin-left:auto;border-bottom-right-radius:4px}
    .chat-bubble.ai{background:var(--ai-bg);margin-right:auto;border-bottom-left-radius:4px;border:1px solid var(--border)}
    .chat-bubble .chat-meta{font-size:10px;color:var(--text-3);margin-top:6px;font-family:var(--mono)}
    .chat-bubble .chat-img{max-width:100%;max-height:200px;border-radius:var(--r-sm);margin-bottom:6px;display:block}
    .chat-bubble .tts-play{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px auto 2px;padding:10px 24px;font-size:13px;font-weight:600;color:#fff;background:var(--teal);border:2px solid transparent;border-radius:100px;cursor:pointer;font-family:var(--font);transition:all 0.25s;min-height:44px}
    .chat-bubble .tts-play:hover{background:var(--teal-hover)}
    .chat-bubble .tts-play svg{width:16px;height:16px;flex-shrink:0}
    .chat-bubble .tts-play.on-demand{border-color:var(--teal);background:var(--teal-dim);color:var(--teal);animation:tts-glow 2s ease-in-out infinite}
    .chat-bubble .tts-play.on-demand:hover{background:var(--teal);color:#fff}
    @keyframes tts-glow{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,0.3)}50%{box-shadow:0 0 0 6px rgba(13,148,136,0)}}
    .chat-bubble .tts-play.loading{opacity:0.7;pointer-events:none}
    .chat-bubble .tts-play.replay{padding:6px 16px;font-size:11px;font-weight:500;min-height:0;background:var(--teal-dim);color:var(--teal);border-color:transparent}
    .chat-bubble .tts-play.replay:hover{background:var(--teal);color:#fff}
    .chat-bubble .tts-play.replay svg{width:12px;height:12px}
    .chat-typing{color:var(--text-3);font-style:italic;font-size:12px;padding:4px 14px}

    /* ── Inline Key Setup (in chat) ──────────────────── */
    .chat-setup{margin-top:8px}
    .chat-setup-label{font-size:10px;font-weight:600;color:var(--text-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em}
    .chat-setup-row{display:flex;gap:5px;margin-bottom:6px}
    .chat-setup-input{flex:1;padding:8px 10px;font-size:11px;font-family:var(--mono);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);outline:none;transition:border var(--t)}
    .chat-setup-input:focus{border-color:var(--teal)}
    .chat-setup-input::placeholder{color:var(--text-3)}
    .chat-setup-select{padding:8px 8px;font-size:11px;font-family:var(--font);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);outline:none}
    .chat-setup-btn{padding:7px 14px;font-size:11px;font-weight:600;font-family:var(--font);background:var(--teal);color:#fff;border:none;border-radius:var(--r-md);cursor:pointer;transition:all var(--t)}
    .chat-setup-btn:hover{background:var(--teal-hover)}
    .chat-setup-hint{font-size:10px;color:var(--text-3);margin-top:4px}

    /* ── Markdown in bubbles ──────────────────────────── */
    .chat-bubble .md-content{font-size:13px;line-height:1.6}
    .chat-bubble .md-content p{margin:0 0 8px 0} .chat-bubble .md-content p:last-child{margin-bottom:0}
    .chat-bubble .md-content h1,.chat-bubble .md-content h2,.chat-bubble .md-content h3{margin:10px 0 6px 0;font-weight:600;color:var(--teal);line-height:1.3}
    .chat-bubble .md-content h1{font-size:15px;background:linear-gradient(135deg,var(--teal),#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .chat-bubble .md-content h2{font-size:14px;color:var(--teal)}
    .chat-bubble .md-content h3{font-size:13px;color:var(--teal);opacity:0.85}
    .chat-bubble .md-content strong{font-weight:600;color:var(--teal)}
    .chat-bubble .md-content em{font-style:italic;color:var(--text-2)}
    .chat-bubble .md-content code{font-family:var(--mono);font-size:11px;padding:1px 5px;background:rgba(13,148,136,0.08);color:var(--teal);border:1px solid rgba(13,148,136,0.15);border-radius:3px}
    .chat-bubble .md-content pre{margin:8px 0;padding:10px 12px;background:var(--bg-root);border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto;position:relative}
    .chat-bubble .md-content pre code{display:block;padding:0;background:none;border:none;color:var(--text);font-size:11px;line-height:1.5}
    .chat-bubble .md-content pre::before{content:attr(data-lang);position:absolute;top:4px;right:8px;font-size:9px;color:var(--text-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.03em}
    .chat-bubble .md-content blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--teal);background:var(--teal-dim);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text-2);font-style:italic;font-size:12px}
    .chat-bubble .md-content ul,.chat-bubble .md-content ol{margin:6px 0;padding-left:20px}
    .chat-bubble .md-content li{margin-bottom:3px}
    .chat-bubble .md-content li::marker{color:var(--teal)}
    .chat-bubble .md-content a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(13,148,136,0.3);transition:all var(--t)}
    .chat-bubble .md-content a:hover{border-color:var(--teal)}
    .chat-bubble .md-content hr{border:none;border-top:1px solid var(--border);margin:10px 0}
    .chat-bubble .md-content table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
    .chat-bubble .md-content th,.chat-bubble .md-content td{padding:4px 8px;border:1px solid var(--border);text-align:left}
    .chat-bubble .md-content th{background:var(--teal-dim);color:var(--teal);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.02em}

    /* ── Input Bar (15% bigger) ───────────────────────── */
    .input-bar{flex-shrink:0;border-top:1px solid var(--border);background:var(--bg-1);padding:12px 18px}
    .input-row{display:flex;gap:8px;align-items:flex-end}
    .input-text{flex:1;padding:12px 14px;font-size:15px;font-family:var(--font);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-lg);outline:none;resize:none;min-height:46px;max-height:140px;transition:border var(--t)}
    .input-text:focus{border-color:var(--teal)}
    .input-text::placeholder{color:var(--text-3)}
    .input-actions{display:flex;gap:4px}

    .circle-btn{width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);flex-shrink:0}
    .circle-btn svg{width:20px;height:20px}
    .send-btn{background:var(--teal);color:#fff} .send-btn:hover{background:var(--teal-hover)}
    .send-btn.hidden{display:none}
    .mic-circle{background:var(--teal);color:#fff;border:none} .mic-circle:hover{background:var(--teal-hover)}
    .mic-circle.hidden{display:none}
    .mic-circle.recording{background:var(--err);animation:mic-p 1.5s ease-in-out infinite}
    @keyframes mic-p{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.3)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
    .attach-btn{background:transparent;color:var(--text-3);border:none;width:40px;height:44px} .attach-btn:hover{color:var(--text-2)}
    .attach-btn svg{width:20px;height:20px}

    .input-hint{font-size:11px;color:var(--text-3);margin-top:5px;text-align:center}
    .input-hint.active{color:var(--err)} .input-hint.ok{color:var(--ok)}

    /* ── File Preview (multi-file stack) ──────────────── */
    .file-stack{display:none;flex-wrap:wrap;gap:6px;padding:8px 0;margin-bottom:4px}
    .file-stack.visible{display:flex}
    .file-stack-item{position:relative;width:56px;height:56px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--bg-input)}
    .file-stack-item img{width:100%;height:100%;object-fit:cover}
    .file-stack-item .file-stack-name{position:absolute;bottom:0;left:0;right:0;padding:2px 4px;font-size:8px;color:#fff;background:rgba(0,0,0,0.6);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-stack-item .file-stack-rm{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--err);color:#fff;border:2px solid var(--bg-1);font-size:10px;line-height:14px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .file-stack-audio{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);font-size:10px;color:var(--text-2)}
    .file-stack-audio svg{width:12px;height:12px;color:var(--teal)}

    /* ── Cards (Settings/Agent pages) ──────────────────── */
    .page-scroll{flex:1;overflow-y:auto;padding:16px}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
    .card-title svg{width:14px;height:14px;color:var(--text-3)}
    .key-row{margin-bottom:10px} .key-row:last-child{margin-bottom:0}
    .key-label{font-size:10px;font-weight:600;color:var(--text-2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.04em}
    .key-desc{font-size:10px;color:var(--text-3);margin-bottom:4px}
    .key-input-row{display:flex;gap:5px}
    .key-input{flex:1;padding:8px 10px;font-size:11px;font-family:var(--mono);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);outline:none;transition:border var(--t)}
    .key-input:focus{border-color:var(--teal)} .key-input::placeholder{color:var(--text-3)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:7px 12px;font-size:11px;font-weight:500;font-family:var(--font);border:1px solid transparent;border-radius:var(--r-md);cursor:pointer;transition:all var(--t);white-space:nowrap}
    .btn svg{width:12px;height:12px}
    .btn-teal{background:var(--teal);color:#fff} .btn-teal:hover{background:var(--teal-hover)}
    .btn-ghost{background:transparent;color:var(--text-2);border-color:var(--border)} .btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
    .btn-danger{background:rgba(239,68,68,0.1);color:var(--err)} .btn-danger:hover{background:var(--err);color:#fff}
    .btn-sm{padding:4px 8px;font-size:10px}
    .key-status{font-size:10px;margin-top:3px} .key-status.ok{color:var(--ok)} .key-status.off{color:var(--text-3)}

    /* ── Agent ──────────────────────────────────────────── */
    .agent-info{display:flex;flex-wrap:wrap;gap:10px;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md)}
    .agent-stat{flex:1;min-width:70px}
    .agent-stat-label{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.03em}
    .agent-stat-val{font-size:11px;font-weight:500;font-family:var(--mono)}
    .mode-toggle{display:flex;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-top:10px}
    .mode-btn{flex:1;padding:7px 10px;font-size:11px;font-weight:500;font-family:var(--font);background:transparent;border:none;color:var(--text-3);cursor:pointer;transition:all var(--t)}
    .mode-btn:hover{color:var(--text-2)} .mode-btn.active{background:var(--teal);color:#fff}
    .mode-desc{font-size:10px;color:var(--text-3);margin-top:4px}

    /* ── System Prompt ─────────────────────────────────── */
    .sys-textarea{width:100%;padding:8px 10px;font-size:11px;font-family:var(--font);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);outline:none;resize:vertical;min-height:60px;transition:border var(--t)}
    .sys-textarea:focus{border-color:var(--teal)}

    /* ── Toast ──────────────────────────────────────────── */
    .toast{position:fixed;bottom:16px;right:16px;padding:8px 14px;font-size:11px;font-weight:500;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:200;opacity:0;transform:translateY(6px);transition:all 0.3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)} .toast.ok{border-color:var(--ok);color:var(--ok)} .toast.err{border-color:var(--err);color:var(--err)}

    /* ── Overlay ───────────────────────────────────────── */
    .overlay{position:fixed;inset:0;background:var(--bg-overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px);cursor:pointer}
    .overlay.hidden{display:none}
    .overlay-btn{padding:12px 32px;font-size:13px;font-weight:600;font-family:var(--font);background:var(--teal);color:#fff;border:none;border-radius:var(--r-lg);cursor:pointer}
    .overlay-hint{margin-top:8px;font-size:11px;color:var(--text-3)}

    /* ── Buy Me a Coffee ──────────────────────────────── */
    .bmc-link{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2);text-decoration:none;transition:all var(--t)}
    .bmc-link:hover{border-color:#ffdd00;color:#ffdd00;background:rgba(255,221,0,0.08)}
    .bmc-card{text-align:center;background:var(--bg-card);border:1px dashed var(--border-2);border-radius:var(--r-lg);padding:14px}
    .bmc-card a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:600;font-family:var(--font);color:#0a0a0a;background:#ffdd00;border:none;border-radius:var(--r-md);text-decoration:none;transition:all var(--t)}
    .bmc-card a:hover{background:#e6c700}
    .bmc-card a svg{width:14px;height:14px}
    .bmc-card p{font-size:10px;color:var(--text-3);margin-top:6px}

    /* ── Privacy ───────────────────────────────────────── */
    .privacy-bar{text-align:center;padding:8px;font-size:10px;color:var(--text-3);border-top:1px solid var(--border);flex-shrink:0}
    .privacy-bar a{color:var(--text-3);text-decoration:none;transition:color var(--t)}
    .privacy-bar a:hover{color:#ffdd00}

    /* ── Bottom Sheet ─────────────────────────────────── */
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;opacity:0;pointer-events:none;transition:opacity 0.3s}
    .sheet-backdrop.open{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:301;background:var(--bg-1);border-top:1px solid var(--border);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);max-height:85vh;display:flex;flex-direction:column}
    .sheet.open{transform:translateY(0)}
    .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border-2);margin:10px auto 0;flex-shrink:0}
    .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;flex-shrink:0}
    .sheet-title{font-size:15px;font-weight:600}
    .sheet-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-hover);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1}
    .sheet-body{flex:1;overflow-y:auto;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
    .sheet-section{margin-top:16px}
    .sheet-section-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
    .sheet-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;transition:all var(--t)}
    .sheet-row:hover{border-color:var(--border-2)}
    .sheet-row-icon{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sheet-row-icon svg{width:16px;height:16px}
    .sheet-row-icon.ok{background:rgba(34,197,94,0.12);color:var(--ok)}
    .sheet-row-icon.off{background:var(--bg-hover);color:var(--text-3)}
    .sheet-row-info{flex:1;min-width:0}
    .sheet-row-label{font-size:13px;font-weight:500}
    .sheet-row-desc{font-size:10px;color:var(--text-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sheet-row-action{font-size:11px;color:var(--teal);font-weight:500;white-space:nowrap}
    .sheet-input-group{margin-bottom:12px}
    .sheet-input-label{font-size:11px;font-weight:500;color:var(--text-2);margin-bottom:4px}
    .sheet-input{width:100%;padding:10px 12px;font-size:12px;font-family:var(--mono);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);outline:none;transition:border var(--t)}
    .sheet-input:focus{border-color:var(--teal)}
    .sheet-input::placeholder{color:var(--text-3)}
    .sheet-btn{width:100%;padding:12px;font-size:13px;font-weight:600;font-family:var(--font);border:none;border-radius:var(--r-md);cursor:pointer;transition:all var(--t)}
    .sheet-btn-teal{background:var(--teal);color:#fff} .sheet-btn-teal:hover{background:var(--teal-hover)}
    .sheet-btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)} .sheet-btn-ghost:hover{background:var(--bg-hover)}
    .sheet-btn-danger{background:rgba(239,68,68,0.1);color:var(--err)} .sheet-btn-danger:hover{background:var(--err);color:#fff}
    .sheet-link{color:var(--teal);text-decoration:none;font-size:11px}
    .sheet-link:hover{text-decoration:underline}
    .sheet-divider{height:1px;background:var(--border);margin:16px 0}

    /* ── Camera ───────────────────────────────────────── */
    .cam-overlay{position:fixed;inset:0;background:var(--bg-root);z-index:1000;display:flex;flex-direction:column}
    .cam-overlay.hidden{display:none}
    .cam-video{flex:1;object-fit:cover;background:#000}
    .cam-controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px;background:var(--bg-1);border-top:1px solid var(--border)}
    .cam-btn{width:48px;height:48px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t)}
    .cam-btn svg{width:20px;height:20px}
    .cam-shutter{width:60px;height:60px;background:#fff;border:3px solid var(--teal)}
    .cam-shutter:active{background:var(--teal)}
    .cam-flip{background:var(--bg-hover);color:var(--text-2);border:1px solid var(--border)}
    .cam-torch{background:var(--bg-hover);color:var(--text-2);border:1px solid var(--border)}
    .cam-torch.on{background:rgba(245,158,11,0.15);color:var(--warn);border-color:var(--warn)}
    .cam-close{background:rgba(239,68,68,0.1);color:var(--err);border:1px solid transparent}

    /* (Voice selector removed -- settings via chat) */

    /* ── Generated Image in Chat ─────────────────────── */
    .chat-bubble .gen-img{max-width:100%;max-height:400px;border-radius:var(--r-md);margin-top:6px;display:block;border:1px solid var(--border)}
    .chat-bubble .gen-spinner{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--teal);padding:8px 0}
    .chat-bubble .gen-spinner::before{content:'';width:14px;height:14px;border:2px solid var(--teal-dim);border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Agent Selector (Chat) ────────────────────────── */
    .agent-selector{display:flex;align-items:center;gap:6px;padding:4px 0;margin-bottom:4px}
    .agent-selector select{flex:1;padding:5px 8px;font-size:11px;font-family:var(--font);color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-sm);outline:none}
    .agent-selector select:focus{border-color:var(--teal)}
    .agent-selector-label{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap}

    /* ── Agent List (Settings) ────────────────────────── */
    .agent-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px}
    .agent-item.active{border-color:var(--teal)}
    .agent-item-info{flex:1;min-width:0}
    .agent-item-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agent-item-url{font-size:10px;color:var(--text-3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agent-item-actions{display:flex;gap:4px}

    /* ── Responsive ────────────────────────────────────── */
    @media(max-width:600px){
      .topbar{padding:0 10px;height:44px;gap:6px} .logo{font-size:13px} .topbar-nav{margin-left:6px;gap:0} .tab-btn{padding:5px 7px;font-size:10px}
      .chat-scroll{padding:10px} .input-bar{padding:8px 10px} .page-scroll{padding:10px} .card{padding:12px;border-radius:var(--r-md)}
      .key-input-row{flex-direction:column}
    }
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  </style>
</head>
<body>

  <div class="overlay" id="overlay" style="cursor:pointer">
    <button class="overlay-btn" id="enableBtn" style="padding:20px 48px;font-size:16px;border-radius:var(--r-lg)">Enable Audio</button>

      <div class="input-row">
        <button class="circle-btn attach-btn" id="attachBtn" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="circle-btn attach-btn" id="cameraBtn" title="Take photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <textarea class="input-text" id="textIn" placeholder="Message..." rows="1"></textarea>
        <button class="circle-btn mic-circle" id="micBtn" title="Hold to speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="circle-btn send-btn hidden" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>

  </div>

  <!-- ═══ Settings Bottom Sheet ═══ -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">Settings</div>
      <button class="sheet-close" id="sheetClose">&times;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Camera overlay -->
  <div class="cam-overlay hidden" id="camOverlay">
    <video id="camVideo" class="cam-video" autoplay playsinline></video>
    <div class="cam-controls">
      <button class="cam-btn cam-close" id="camClose" title="Cancel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="cam-btn cam-torch" id="camTorch" title="Flashlight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
      <button class="cam-btn cam-shutter" id="camShutter" title="Take photo"></button>
      <button class="cam-btn cam-flip" id="camFlip" title="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" style="display:none"></audio>
  <input type="file" id="fileIn" accept="image/*,.pdf,.txt,.json,.js,.ts,.py,.md,.csv,.log" multiple style="display:none">
  <canvas id="camCanvas" style="display:none"></canvas>

  <script>
    const $=id=>document.getElementById(id), toast=$('toast'), audio=$('audio');
    let audioEnabled=false, chatHistory=[], pendingFile=null, stream=null, recorder=null, chunks=[], recording=false;

    function showToast(m,t=''){toast.textContent=m;toast.className='toast show '+t;setTimeout(()=>toast.className='toast',3000)}
    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

    // ── Markdown Renderer ───────────────────────────────
    function renderMd(text){
      if(!text)return '';
      let html=esc(text);

      // Code blocks (``` ... ```) - must be first
      html=html.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>
        `<pre data-lang="${lang}"><code>${code.trim()}</code></pre>`);

      // Inline code
      html=html.replace(/`([^`]+)`/g,'<code>$1</code>');

      // Headers
      html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
      html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
      html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');

      // Bold + Italic
      html=html.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
      html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');

      // Blockquotes
      html=html.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');

      // Horizontal rules
      html=html.replace(/^---$/gm,'<hr>');

      // Links [text](url)
      html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Unordered lists
      html=html.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
      html=html.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');

      // Ordered lists
      html=html.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');

      // Tables
      html=html.replace(/^\|(.+)\|$/gm,(m,row)=>{
        const cells=row.split('|').map(c=>c.trim()).filter(Boolean);
        if(cells.every(c=>/^[\-:]+$/.test(c)))return '';
        const tag=cells.every(c=>c===c.toUpperCase()&&c.length<30)?'th':'td';
        return '<tr>'+cells.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
      });
      html=html.replace(/(<tr>.*<\/tr>\n?)+/g,'<table>$&</table>');

      // Paragraphs: wrap remaining loose text lines
      html=html.split('\n').map(line=>{
        const trimmed=line.trim();
        if(!trimmed)return '';
        if(/^<(h[1-6]|ul|ol|li|pre|blockquote|hr|table|tr|th|td|div)/.test(trimmed))return line;
        return `<p>${trimmed}</p>`;
      }).join('\n');

      // Clean up empty paragraphs and double wrapping
      html=html.replace(/<p><\/p>/g,'');
      html=html.replace(/<p>(<h[1-6]>)/g,'$1');
      html=html.replace(/(<\/h[1-6]>)<\/p>/g,'$1');
      html=html.replace(/<p>(<pre)/g,'$1');
      html=html.replace(/(<\/pre>)<\/p>/g,'$1');
      html=html.replace(/<p>(<blockquote)/g,'$1');
      html=html.replace(/(<\/blockquote>)<\/p>/g,'$1');
      html=html.replace(/<p>(<ul>)/g,'$1');
      html=html.replace(/(<\/ul>)<\/p>/g,'$1');
      html=html.replace(/<p>(<table>)/g,'$1');
      html=html.replace(/(<\/table>)<\/p>/g,'$1');
      html=html.replace(/<p>(<hr>)/g,'$1');
      html=html.replace(/(<hr>)<\/p>/g,'$1');

      return html;
    }

    // ── Storage ────────────────────────────────────────
    function getK(){try{return JSON.parse(localStorage.getItem('tc-keys')||'{}')}catch{return{}}}
    function setK(k){localStorage.setItem('tc-keys',JSON.stringify(k))}
    function getChat(){try{return JSON.parse(localStorage.getItem('tc-chat')||'[]')}catch{return[]}}
    function setChat(c){localStorage.setItem('tc-chat',JSON.stringify(c.slice(-100)))}
    function getAgents(){try{return JSON.parse(localStorage.getItem('tc-agents')||'[]')}catch{return[]}}
    function setAgents(a){localStorage.setItem('tc-agents',JSON.stringify(a))}

    // ── Smart Key Detection ─────────────────────────────
    function detectKey(val){
      val=val.trim();
      if(val.startsWith('sk-or-v1-'))return{field:'aiKey',provider:'openrouter',label:'OpenRouter AI Key'};
      if(val.startsWith('gsk_'))return{field:'whisperKey',provider:'groq',label:'Groq Key (chat + vision + voice)'};
      if(/^sk_[a-f0-9]{40,}$/i.test(val))return{field:'ttsKey',label:'ElevenLabs TTS Key'};
      if(/^\d{6,}:[A-Za-z0-9_-]{30,}$/.test(val))return{field:'tgToken',label:'Telegram Bot Token'};
      if(/^-?\d{6,}$/.test(val))return{field:'tgChatId',label:'Telegram Chat ID'};
      if(/^https?:\/\/.+:\d{4,5}$/.test(val))return{field:'gwUrl',label:'Gateway URL'};
      if(/^[a-f0-9]{32,}$/.test(val))return{field:'gwToken',label:'Gateway Token'};
      if(/^https?:\/\/.*\/(images|generate|img)/i.test(val))return{field:'imageGenUrl',label:'Image Gen Endpoint'};
      if(val.startsWith('sk-'))return{field:'aiKey',provider:'openrouter',label:'AI Key (OpenRouter?)'};
      return null;
    }

    function loadUI(){
      updateStatus();
      renderAgentSelector();
      chatHistory=getChat();
      renderChat();
    }

    function updateStatus(){
      const k=getK();
      const pill=$('pill');
      if(k.aiKey||k.whisperKey){pill.className='pill ok';$('pillLabel').textContent=k.aiProvider==='groq'||(!k.aiKey&&k.whisperKey)?'Groq':'Ready'}
      else{pill.className='pill off';$('pillLabel').textContent='Setup'}
    }

    // ── Theme ──────────────────────────────────────────
    document.documentElement.setAttribute('data-theme',localStorage.getItem('tc-theme')||'dark');
    $('themeBtn').addEventListener('click',()=>{
      const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',n);localStorage.setItem('tc-theme',n);
    });

    // ── Bottom Sheet ───────────────────────────────────
    const sheetBackdrop=$('sheetBackdrop'), settingsSheet=$('settingsSheet');

    function openSheet(){settingsSheet.classList.add('open');sheetBackdrop.classList.add('open');renderSheetContent()}
    function closeSheet(){settingsSheet.classList.remove('open');sheetBackdrop.classList.remove('open')}

    $('settingsBtn').addEventListener('click',openSheet);
    $('sheetClose').addEventListener('click',closeSheet);
    sheetBackdrop.addEventListener('click',closeSheet);

    function renderSheetContent(){
      const k=getK();
      const keys=[
        {label:'OpenRouter Key',desc:'Gemini Flash for chat + vision',field:'aiKey',val:k.aiKey,link:'https://openrouter.ai/keys',linkText:'Get key',prefix:'sk-or-v1-'},
        {label:'Groq Key',desc:'Whisper voice transcription',field:'whisperKey',val:k.whisperKey,link:'https://console.groq.com/keys',linkText:'Get key',prefix:'gsk_'},
        {label:'ElevenLabs Key',desc:'Voice output (TTS)',field:'ttsKey',val:k.ttsKey,link:'https://elevenlabs.io/app/settings/api-keys',linkText:'Get key',prefix:'sk_'},
        {label:'Telegram Bot Token',desc:k.tgToken&&k.tgEnabled?'Active':'Forward messages to Telegram',field:'tgToken',val:k.tgToken,link:'https://t.me/BotFather',linkText:'Create bot'},
        {label:'Telegram Chat ID',desc:'Your user or group ID',field:'tgChatId',val:k.tgChatId,link:'https://t.me/userinfobot',linkText:'Get ID'}
      ];

      let html=`<div class="sheet-section"><div class="sheet-section-title">API Keys</div>`;
      keys.forEach(({label,desc,field,val,link,linkText,prefix})=>{
        const on=!!val;
        const masked=val?val.slice(0,6)+'...'+val.slice(-3):'Not set';
        html+=`<div class="sheet-row" data-field="${field}">
          <div class="sheet-row-icon ${on?'ok':'off'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></div>
          <div class="sheet-row-info"><div class="sheet-row-label">${label}</div><div class="sheet-row-desc">${on?masked:desc}</div></div>
          <div class="sheet-row-action">${on?'Change':'Set up'}</div>
        </div>`;
      });
      html+=`</div>`;

      // Agent section
      const agents=getAgents();
      html+=`<div class="sheet-section"><div class="sheet-section-title">OpenClaw Agent</div>`;
      html+=`<div class="sheet-row" id="sheetAgentRow">
        <div class="sheet-row-icon ${agents.length?'ok':'off'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></div>
        <div class="sheet-row-info"><div class="sheet-row-label">Gateway</div><div class="sheet-row-desc">${agents.length?agents.find(a=>a.active)?.name||agents[0]?.name:'Not configured'}</div></div>
        <div class="sheet-row-action">${agents.length?'Manage':'Add'}</div>
      </div></div>`;

      // Mode toggle
      const mode=k.mode||'direct';
      html+=`<div class="sheet-section"><div class="sheet-section-title">Chat Mode</div>
        <div style="display:flex;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden">
          <button class="mode-btn ${mode==='direct'?'active':''}" data-mode="direct" style="flex:1;padding:10px;font-size:12px;font-weight:500;font-family:var(--font);background:${mode==='direct'?'var(--teal)':'transparent'};border:none;color:${mode==='direct'?'#fff':'var(--text-3)'};cursor:pointer">Direct (Gemini)</button>
          <button class="mode-btn ${mode==='agent'?'active':''}" data-mode="agent" style="flex:1;padding:10px;font-size:12px;font-weight:500;font-family:var(--font);background:${mode==='agent'?'var(--teal)':'transparent'};border:none;color:${mode==='agent'?'#fff':'var(--text-3)'};cursor:pointer">Agent (OpenClaw)</button>
        </div>
        <div style="font-size:10px;color:var(--text-3);margin-top:6px;padding:0 2px">${mode==='direct'?'Gemini Flash via OpenRouter -- fast, no agent memory':'Routes through your OpenClaw gateway -- shared context across all channels'}</div>
      </div>`;

      // Voice output toggle (only show when TTS key is set)
      if(k.ttsKey){
        const autoPlay=k.ttsAutoPlay!==false;
        html+=`<div class="sheet-section"><div class="sheet-section-title">Voice Output</div>
          <div style="display:flex;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden">
            <button class="mode-btn tts-mode-btn ${autoPlay?'active':''}" data-tts="true" style="flex:1;padding:10px;font-size:12px;font-weight:500;font-family:var(--font);background:${autoPlay?'var(--teal)':'transparent'};border:none;color:${autoPlay?'#fff':'var(--text-3)'};cursor:pointer">Auto-play</button>

    // ── Audio (Web Audio API for reliable mobile playback) ──
    let audioCtx=null;

    function ensureAudioCtx(){
      if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      }
      // Resume if suspended (mobile browsers suspend until gesture)
      if(audioCtx.state==='suspended')audioCtx.resume();
      return audioCtx;
    }

    // Play audio buffer reliably on all platforms
    async function playAudioBuffer(arrayBuffer){
      const ctx=ensureAudioCtx();
      try{
        const decoded=await ctx.decodeAudioData(arrayBuffer.slice(0));
        const source=ctx.createBufferSource();
        source.buffer=decoded;
        source.connect(ctx.destination);
        source.start(0);
        return source;
      }catch(e){
        // Fallback to <audio> element if Web Audio fails
        console.warn('Web Audio fallback:',e);
        const blob=new Blob([arrayBuffer],{type:'audio/mpeg'});
        audio.src=URL.createObjectURL(blob);
        audio.play().catch(()=>{});
        return null;
      }
    }

    function enableAudio(){
      if(audioEnabled)return;
      audioEnabled=true;
      $('overlay').classList.add('hidden');
      ensureAudioCtx();
      audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      audio.play().then(()=>showToast('Audio enabled','ok')).catch(()=>{});
    }
    // Tap anywhere on overlay to enable
    $('overlay').addEventListener('click',enableAudio);
    $('enableBtn').addEventListener('click',enableAudio);
    audio.volume=0.8;

    // Auto-enable on desktop (no user gesture needed for AudioContext)
    if(!('ontouchstart' in window)){enableAudio()}

    // Belt+suspenders: unlock audio context on any user interaction
    ['touchstart','mousedown','keydown'].forEach(evt=>{
      document.addEventListener(evt,function unlock(){ensureAudioCtx();document.removeEventListener(evt,unlock)},{once:true});
    });

    // ── Chat Rendering ─────────────────────────────────
    function renderChat(){
      const s=$('chatScroll');
      if(chatHistory.length===0){/* onboarding will fill this */return}
      const ck=getK();
      const hasTts=!!ck.ttsKey;
      s.innerHTML=chatHistory.map((m,i)=>{
        let content='';
        if(m.image) content+=`<img class="chat-img" src="${m.image}">`;
        if(m.role==='ai'){
          content+=`<div class="md-content">${renderMd(m.text)}</div>`;
        } else {
          content+=esc(m.text);
        }
        // Show Play/Replay button on AI messages when TTS key is configured
        if(m.role==='ai'&&hasTts){
          if(m.audioUrl){
            content+=`<button class="tts-play replay" data-idx="${i}"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Replay</button>`;
          } else {
            content+=`<button class="tts-play on-demand" data-idx="${i}"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Play</button>`;
          }
        }
        return `<div class="chat-bubble ${m.role}">${content}<div class="chat-meta">${m.time||''}</div></div>`;
      }).join('');
      s.scrollTop=s.scrollHeight;

      // Wire up Play/Replay buttons
      s.querySelectorAll('.tts-play').forEach(b=>b.addEventListener('click',async()=>{
        const idx=+b.dataset.idx;
        const m=chatHistory[idx];
        if(!m||!audioEnabled)return;
        if(m.audioUrl){
          // Replay from cache — no API call
          audio.src=m.audioUrl;audio.play().catch(()=>{});
        } else {
          // On-demand: call ElevenLabs, cache result
          b.classList.remove('on-demand');b.classList.add('loading');
          b.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Playing...';
          const ttsData=await speak(m.text);
          if(ttsData){
            const blob=new Blob([ttsData],{type:'audio/mpeg'});
            const url=URL.createObjectURL(blob);
            chatHistory[idx].audioUrl=url;
            setChat(chatHistory);
            playAudioBuffer(ttsData);
          }
          // Re-render so button becomes Replay
          renderChat();
        }
      }));
    }

    // ── AI Call ─────────────────────────────────────────
    async function callAI(userText,imageBase64){
      const k=getK();
      const mode=k.mode||'direct';

      if(mode==='agent'&&getActiveAgent()){
        return callAgent(userText,imageBase64);
      }

      // Primary: OpenRouter (Gemini Flash). Fallback: Groq (free).
      const aiKey=k.aiKey||k.whisperKey;
      if(!aiKey)return '__NO_KEY__';

      const isGroqFallback=!k.aiKey&&!!k.whisperKey;
      const groqVisionModel='meta-llama/llama-4-maverick-17b-128e-instruct';
      const groqChatModel='llama-3.3-70b-versatile';

      const url=isGroqFallback
        ?'https://api.groq.com/openai/v1/chat/completions'
        :'https://openrouter.ai/api/v1/chat/completions';
      const model=isGroqFallback
        ?(imageBase64?groqVisionModel:groqChatModel)
        :(k.aiModel||'google/gemini-2.5-flash-preview');

      const sys=k.sysPrompt||'You are a helpful voice assistant. Keep responses concise (1-3 sentences).';

      // Build messages with conversation history
      const histMsgs=chatHistory.slice(-20).filter(m=>m.role==='user'||m.role==='ai').map(m=>({
        role:m.role==='user'?'user':'assistant',content:m.text
      }));

      let userContent;
      if(imageBase64){
        userContent=[{type:'text',text:userText||'What do you see?'},{type:'image_url',image_url:{url:imageBase64}}];
      } else {
        userContent=userText;
      }

      const msgs=[{role:'system',content:sys},...histMsgs,{role:'user',content:userContent}];
      const res=await fetch(url,{
        method:'POST',
        headers:{'Authorization':`Bearer ${aiKey}`,'Content-Type':'application/json'},
        body:JSON.stringify({model,messages:msgs,max_tokens:400})
      });
      const d=await res.json();
      if(d.error) throw new Error(d.error.message||'API error');
      return d.choices?.[0]?.message?.content||'';
    }

    // ── Agent Call (Tailscale) ──────────────────────────
    function getActiveAgent(){
      const agents=getAgents();
      const sel=$('agentChatSelect').value;
      if(sel)return agents.find(a=>a.id===sel);
      return agents.find(a=>a.active)||agents[0];
    }

    async function callAgent(text,imageBase64){
      const agent=getActiveAgent();
      if(!agent)throw new Error('No agent configured');
      let content;
      if(imageBase64){
        content=[{type:'text',text:text||'What do you see?'},{type:'image_url',image_url:{url:imageBase64}}];
      } else {
        content=text;
      }
      const res=await fetch(`${agent.url}/v1/chat/completions`,{
        method:'POST',
        headers:{'Authorization':`Bearer ${agent.token}`,'Content-Type':'application/json'},
        body:JSON.stringify({messages:[{role:'user',content}],max_tokens:400})
      });
      if(!res.ok) throw new Error(`Gateway: ${res.status}`);
      const d=await res.json();
      const c=d.choices?.[0]?.message?.content||'';
      if(c.includes('Unhandled stop reason')) throw new Error('Agent busy, try again');
      return c;
    }

    // ── Transcribe ─────────────────────────────────────
    async function transcribe(blob){
      const k=getK();
      const key=k.whisperKey||(k.aiProvider==='groq'?k.aiKey:'');
      if(!key){showToast('No transcription key','err');return ''}
      const fd=new FormData();fd.append('file',blob,'voice.webm');fd.append('model','whisper-large-v3');fd.append('response_format','json');
      const res=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{'Authorization':`Bearer ${key}`},body:fd});
      const d=await res.json();return d.text||'';
    }

    // ── TTS ────────────────────────────────────────────
    async function speak(text){
      const k=getK();if(!k.ttsKey)return null;
      const vid=k.ttsVoice||'ThT5KcBeYPX7keBQBPPD';
      const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vid}`,{
        method:'POST',headers:{'Accept':'audio/mpeg','Content-Type':'application/json','xi-api-key':k.ttsKey},
        body:JSON.stringify({text,voice_settings:{stability:0.3,similarity_boost:1.0}})
      });
      if(!res.ok)return null;return await res.arrayBuffer();
    }

<p>You're using <strong>${provider}</strong>. `;

    function getOptionalSteps(){
      const k=getK();
      const missing=[];
      if(!k.aiKey&&!k.whisperKey)missing.push('AI key (<code>sk-or-v1-</code> or <code>gsk_</code>)');
      if(!k.whisperKey&&k.aiProvider!=='groq')missing.push('Groq key for voice input (<code>gsk_</code>)');
      if(!k.ttsKey)missing.push('ElevenLabs key for voice output (<code>sk_</code>)');
      if(!missing.length)return '<p>All set! Type <code>/help</code> to see available commands.</p>';
      return `<p>You can also add: ${missing.join(', ')}. Just paste anytime.</p>`;
    }

    // ── Pipeline ───────────────────────────────────────
    async function pipeline(text,imageBase64){
      if(!text&&!imageBase64)return;
      addBubble('user',text||'[Image]',imageBase64?{image:imageBase64}:{});
      addTyping();

      // Forward user message to Telegram
      sendTelegram(`You: ${text||'[Image]'}`);

      try{
        const aiText=await callAI(text,imageBase64);
        removeTyping();
        if(aiText==='__NO_KEY__'){
          sysBubble(`<p>I need an AI key to respond. Paste one of these in the chat:</p>
<ul>
<li><a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a> -- <code>sk-or-v1-...</code> (Gemini Flash, recommended)</li>
<li><a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq</a> -- <code>gsk_...</code> (free + fast)</li>
</ul>`);
          return;
        }
        if(!aiText){addBubble('ai','(No response)');return}

        // Forward AI response to Telegram
        sendTelegram(`AI: ${aiText}`);

        // TTS: only call ElevenLabs when autoPlay is on (saves API credits)
        let audioUrl=null;
        const ttsK=getK();
        const autoPlay=ttsK.ttsAutoPlay!==false; // default true for backward compat
        if(audioEnabled&&ttsK.ttsKey&&autoPlay){
          const ttsData=await speak(aiText);
          if(ttsData){
            const blob=new Blob([ttsData],{type:'audio/mpeg'});
            audioUrl=URL.createObjectURL(blob);
            playAudioBuffer(ttsData);
          }
        }
        addBubble('ai',aiText,audioUrl?{audioUrl}:{});
      }catch(e){
        removeTyping();
        addBubble('ai',`Error: ${e.message}`);
        showToast(e.message,'err');
      }
    }

    // ── Mic/Send Toggle ───────────────────────────────
    function updateActionBtn(){
      const hasText=$('textIn').value.trim().length>0;
      const hasFiles=pendingFiles.length>0;
      $('micBtn').classList.toggle('hidden',hasText||hasFiles);
      $('sendBtn').classList.toggle('hidden',!hasText&&!hasFiles);
    }

    // ── Send ───────────────────────────────────────────
    function send(){
      const text=$('textIn').value.trim();
      const images=pendingFiles.filter(f=>f.dataUrl).map(f=>f.dataUrl);
      const firstImage=images[0]||null;
      if(!text&&!firstImage)return;
      $('textIn').value='';$('textIn').style.height='auto';
      clearAllFiles();
      updateActionBtn();

      // Check if it's an API key being pasted
      if(text&&!firstImage&&handleChatKey(text))return;

      // Chat commands
      if(text.startsWith('/')){
        const cmd=text.toLowerCase();
        if(cmd==='/help'){
          sysBubble(`<h3>Commands</h3>
<ul>
<li><code>/setup</code> -- restart the setup wizard</li>
<li><code>/telegram</code> -- set up Telegram forwarding</li>
<li><code>/telegram on</code> / <code>/telegram off</code> -- toggle forwarding</li>
<li><code>/imagine prompt</code> -- generate an image</li>
<li><code>/keys</code> -- show what's configured</li>
<li><code>/clear</code> -- clear chat history</li>
<li><code>/voice</code> -- change TTS voice</li>
</ul>
<p>You can also paste any API key directly in the chat to add it.</p>`);
          return;
        }
        if(cmd==='/setup'){
          sysBubble(`<h3>Setup Wizard</h3>
<p>Paste any of these keys in the chat to configure:</p>
<p><strong>AI Chat</strong> (pick one):</p>
<ul>
<li><a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a> -- <code>sk-or-v1-...</code> (Gemini Flash, recommended)</li>
<li><a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq</a> -- <code>gsk_...</code> (free, also enables voice input)</li>
</ul>
<p><strong>Voice Input</strong> (optional): <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq key</a> -- <code>gsk_...</code></p>
<p><strong>Voice Output</strong> (optional): <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener">ElevenLabs key</a> -- <code>sk_...</code></p>
<p><strong>Telegram</strong>: Type <code>/telegram</code> for setup instructions.</p>`);
          return;
        }
        if(cmd==='/telegram'){
          sysBubble(`<h3>Telegram Setup</h3>
<p>Forward your TealClaw conversations to a Telegram chat.</p>
<h3>Step 1: Create a Bot</h3>
<ol>
<li>Open Telegram and message <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a></li>
<li>Send <code>/newbot</code> and follow the prompts</li>
<li>Copy the <strong>bot token</strong> (looks like <code>123456:ABC-DEF...</code>)</li>
<li>Paste it right here in the chat</li>
</ol>
<h3>Step 2: Get Your Chat ID</h3>
<ol>
<li>Message <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a> on Telegram</li>
<li>It replies with your <strong>Chat ID</strong> (a number like <code>123456789</code>)</li>
<li>Paste it here after the bot token</li>
</ol>
<p>For a group chat: add your bot to the group, then use <code>-100</code> + the group ID.</p>`);
          return;
        }
        if(cmd==='/telegram on'){
          const k=getK();k.tgEnabled=true;setK(k);
          sysBubble('<p>Telegram forwarding <strong>enabled</strong>.</p>');return;
        }
        if(cmd==='/telegram off'){
          const k=getK();k.tgEnabled=false;setK(k);
          sysBubble('<p>Telegram forwarding <strong>disabled</strong>.</p>');return;
        }
        if(cmd==='/keys'){
          const k=getK();
          const lines=[];
          lines.push(k.aiKey?`AI: <strong>OpenRouter</strong> (${k.aiKey.slice(0,8)}...)`:'AI: <strong>not set</strong>'+(k.whisperKey?' (using Groq fallback)':''));
          lines.push(`Model: <code>${k.aiModel||'google/gemini-2.5-flash-preview'}</code>`);
          lines.push(k.whisperKey?'Voice In: <strong>Groq Whisper</strong> (set)':'Voice In: <strong>not set</strong>'+(k.aiProvider==='groq'?' (using AI key)':''));
          lines.push(k.ttsKey?'Voice Out: <strong>ElevenLabs</strong> (set)':'Voice Out: <strong>not set</strong> (text-only)');
          lines.push(k.tgToken&&k.tgChatId?`Telegram: <strong>${k.tgEnabled?'active':'configured (off)'}</strong>`:'Telegram: <strong>not set</strong>');
          lines.push(k.imageGenUrl?'Image Gen: <strong>configured</strong>':'Image Gen: <strong>not set</strong>');
          sysBubble(`<h3>Current Config</h3><ul>${lines.map(l=>'<li>'+l+'</li>').join('')}</ul>
<p>Paste any key to update. Type <code>/clear keys</code> to wipe all keys.</p>`);
          return;
        }
        if(cmd==='/clear'){
          chatHistory=[];setChat([]);renderChat();showToast('Chat cleared','ok');return;
        }
        if(cmd==='/clear keys'){
          localStorage.removeItem('tc-keys');updateStatus();
          sysBubble('<p>All keys cleared. Type <code>/setup</code> to reconfigure.</p>');
          showToast('Keys cleared','ok');return;
        }
        if(cmd==='/voice'){
          const k=getK();
          if(!k.ttsKey){sysBubble('<p>Set an ElevenLabs key first. Get one at <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener">elevenlabs.io</a> and paste the <code>sk_</code> key here.</p>');return}
          sysBubble(`<h3>Voice Settings</h3>
<p>Current voice: <code>${k.ttsVoice||'ThT5KcBeYPX7keBQBPPD'}</code> (Rachel default)</p>
<p>To change, visit <a href="https://elevenlabs.io/app/voice-lab" target="_blank" rel="noopener">ElevenLabs Voice Lab</a>, copy a voice ID, and paste it in the chat.</p>`);
          return;
        }
        if(text.startsWith('/imagine ')){
          const prompt=text.slice(9).trim();
          if(prompt)imagePipeline(prompt);
          else showToast('Usage: /imagine your prompt here','err');
          return;
        }
      }

      // Normal message
      const imageNote=images.length>1?` [${images.length} images attached]`:'';
      pipeline(text+imageNote,firstImage);
    }

    $('sendBtn').addEventListener('click',send);
    $('textIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
    $('textIn').addEventListener('input',()=>{
      const t=$('textIn');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';
      updateActionBtn();
    });

    // ── Multi-File Stack ─────────────────────────────
    let pendingFiles=[];

    function renderFileStack(){
      const el=$('fileStack');
      if(pendingFiles.length===0){el.classList.remove('visible');el.innerHTML='';return}
      el.classList.add('visible');
      el.innerHTML=pendingFiles.map((f,i)=>{
        if(f.type==='audio'){
          return `<div class="file-stack-audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/></svg>${esc(f.name)}<span class="file-stack-rm" data-idx="${i}">&times;</span></div>`;
        }
        return `<div class="file-stack-item">${f.dataUrl?`<img src="${f.dataUrl}">`:'<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:9px;color:var(--text-3);padding:4px;text-align:center">'+esc(f.name)+'</div>'}<span class="file-stack-rm" data-idx="${i}">&times;</span></div>`;
      }).join('');
      el.querySelectorAll('.file-stack-rm').forEach(b=>b.addEventListener('click',()=>{
        pendingFiles.splice(+b.dataset.idx,1);renderFileStack();updateActionBtn();
      }));
    }

    function clearAllFiles(){pendingFiles=[];renderFileStack()}

    // ── File Attach ────────────────────────────────────
    $('attachBtn').addEventListener('click',()=>$('fileIn').click());
    $('fileIn').addEventListener('change',e=>{
      if(e.target.files){for(const f of e.target.files)handleFile(f)}
      $('fileIn').value='';
    });

    document.addEventListener('paste',e=>{
      const items=e.clipboardData?.items;if(!items)return;
      for(const item of items){if(item.kind==='file'){e.preventDefault();handleFile(item.getAsFile())}}
    });

    // Drag and drop on the whole chat area
    const chatArea=$('chatScroll');
    ['dragenter','dragover'].forEach(ev=>chatArea.addEventListener(ev,e=>{e.preventDefault();chatArea.style.outline='2px dashed var(--teal)'}));
    ['dragleave','drop'].forEach(ev=>chatArea.addEventListener(ev,e=>{e.preventDefault();chatArea.style.outline='none'}));
    chatArea.addEventListener('drop',e=>{
      const files=e.dataTransfer?.files;
      if(files){for(const f of files)handleFile(f)}
    });

    function handleFile(file){
      // JSON config file import (from agent or manual)
      if(file.name?.endsWith('.json')||file.type==='application/json'){
        const reader=new FileReader();
        reader.onload=e=>{
          try{
            const cfg=JSON.parse(e.target.result);
            // Check if it looks like a TealClaw config (has any recognized keys)
            const recognized=Object.keys(CONFIG_KEYS);
            const hasConfig=recognized.some(k=>cfg[k]!==undefined)||cfg.agents||cfg.gwUrl;
            if(hasConfig){
              const count=importConfig(cfg);
              updateStatus();renderAgentSelector();
              const parts=[];
              if(cfg.agents?.length)parts.push(`${cfg.agents.length} agent(s)`);
              else if(cfg.gwUrl)parts.push('gateway');
              if(cfg.aiKey)parts.push('AI key');
              if(cfg.whisperKey)parts.push('Groq/Whisper');
              if(cfg.ttsKey)parts.push('ElevenLabs TTS');
              if(cfg.ttsVoice)parts.push('voice');
              if(cfg.tgToken)parts.push('Telegram');
              sysBubble(`<h3>Config Imported!</h3>
<p>Loaded <strong>${count}</strong> settings from <code>${esc(file.name)}</code>:</p>
<p>${parts.join(', ')||'Configuration updated'}</p>
<p>${cfg.mode==='agent'?'Mode set to <strong>Agent</strong> -- routing through your OpenClaw gateway.':'You\'re ready to chat!'}</p>`);
              showToast(`Imported ${count} settings`,'ok');
              return;
            }
          }catch{}
          // Not a config file, treat as regular text
          const txt=e.target.result?.slice(0,8000);
          $('textIn').value=($('textIn').value+'\n\n--- '+file.name+' ---\n'+txt).trim();
          $('textIn').dispatchEvent(new Event('input'));
        };
        reader.readAsText(file);
        return;
      }

      if(file.type?.startsWith('image/')){
        const reader=new FileReader();
        reader.onload=e=>{
          pendingFiles.push({name:file.name,dataUrl:e.target.result,type:'image'});
          renderFileStack();updateActionBtn();
        };
        reader.readAsDataURL(file);
      } else {
        const reader=new FileReader();
        reader.onload=e=>{
          const txt=e.target.result?.slice(0,8000);
          $('textIn').value=($('textIn').value+'\n\n--- '+file.name+' ---\n'+txt).trim();
          $('textIn').dispatchEvent(new Event('input'));
        };
        reader.readAsText(file);
      }
    }

    // ── Microphone ─────────────────────────────────────
    const micBtn=$('micBtn'),hint=$('inputHint');

    async function initMic(){
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
        recorder=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=async()=>{
          if(chunks.length>0){
            hint.textContent='Transcribing...';hint.className='input-hint';
            const blob=new Blob(chunks,{type:'audio/webm'});
            try{
              const text=await transcribe(blob);
              if(text){
                hint.textContent=`"${text.slice(0,40)}..."`;hint.className='input-hint ok';
                // If files are pending, put text in input box instead of auto-sending
                if(pendingFiles.length>0){
                  $('textIn').value=($('textIn').value+' '+text).trim();
                  $('textIn').dispatchEvent(new Event('input'));
                } else {
                  pipeline(text);
                }
              }
              else{hint.textContent='No speech detected';hint.className='input-hint'}
            }catch(e){hint.textContent='Transcription failed';hint.className='input-hint err'}
            setTimeout(()=>{hint.textContent='';hint.className='input-hint'},3000);
          }
          chunks=[];
        };
        return true;
      }catch{hint.textContent='Mic access denied';return false}
    }

    micBtn.addEventListener('mousedown',async e=>{e.preventDefault();if(!recorder&&!await initMic())return;chunks=[];recorder.start();recording=true;micBtn.classList.add('recording');hint.textContent='Release to send';hint.className='input-hint active'});
    micBtn.addEventListener('mouseup',e=>{e.preventDefault();stopRec()});
    micBtn.addEventListener('mouseleave',()=>{if(recording)stopRec()});
    micBtn.addEventListener('touchstart',async e=>{e.preventDefault();if(!recorder&&!await initMic())return;chunks=[];recorder.start();recording=true;micBtn.classList.add('recording');hint.textContent='Release to send';hint.className='input-hint active'});
    micBtn.addEventListener('touchend',e=>{e.preventDefault();stopRec()});

    function stopRec(){if(!recorder||!recording)return;recorder.stop();recording=false;micBtn.classList.remove('recording')}

    // ── Telegram ─────────────────────────────────────────
    async function sendTelegram(text){
      const k=getK();
      if(!k.tgEnabled||!k.tgToken||!k.tgChatId)return;
      try{
        await fetch(`https://api.telegram.org/bot${k.tgToken}/sendMessage`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({chat_id:k.tgChatId,text,parse_mode:'Markdown'})
        });
      }catch(e){console.warn('Telegram send failed:',e)}
    }

    // ── Image Generation ──────────────────────────────
    async function generateImage(prompt){
      const k=getK();
      if(!k.imageGenUrl)return null;
      const apiKey=k.imageGenKey||k.aiKey;
      if(!apiKey){showToast('No API key for image gen','err');return null}
      const body={prompt,n:1,size:k.imageGenSize||'1024x1024'};
      if(k.imageGenModel)body.model=k.imageGenModel;
      const res=await fetch(k.imageGenUrl,{
        method:'POST',
        headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const err=await res.json().catch(()=>({}));
        throw new Error(err.error?.message||`Image API: ${res.status}`);
      }
      const d=await res.json();
      // OpenAI format: {data: [{url: "..."}, ...]} or {data: [{b64_json: "..."}]}
      if(d.data?.[0]?.url)return d.data[0].url;
      if(d.data?.[0]?.b64_json)return 'data:image/png;base64,'+d.data[0].b64_json;
      // FAL/other formats: {images: [{url}]} or {output: {url}} or direct {url}
      if(d.images?.[0]?.url)return d.images[0].url;
      if(d.output?.url)return d.output.url;
      if(d.url)return d.url;
      return null;
    }

    // ── /imagine command in pipeline ────────────────────
    async function imagePipeline(prompt){
      addBubble('user','/imagine '+prompt);
      sendTelegram('You: /imagine '+prompt);

      // Show generating state
      const genBubble=addBubble('ai','');
      const idx=chatHistory.length-1;
      const scroll=$('chatScroll');
      const bubbles=scroll.querySelectorAll('.chat-bubble');
      const lastBubble=bubbles[bubbles.length-1];
      if(lastBubble)lastBubble.innerHTML='<div class="gen-spinner">Generating image...</div>';

      try{
        const imgUrl=await generateImage(prompt);
        if(!imgUrl){
          chatHistory[idx].text='Image generation returned no result.';
          renderChat();return;
        }
        chatHistory[idx].text=`Generated: "${prompt}"`;
        chatHistory[idx].image=imgUrl;
        setChat(chatHistory);
        renderChat();
        sendTelegram(`AI: [Generated image for "${prompt}"]`);
        showToast('Image generated','ok');
      }catch(e){
        chatHistory[idx].text=`Image error: ${e.message}`;
        setChat(chatHistory);
        renderChat();
        showToast(e.message,'err');
      }
    }

    // ── Agent Selector (chat input bar) ─────────────────
    function renderAgentSelector(){
      const agents=getAgents(),sel=$('agentChatSelect'),bar=$('agentSelectorBar');
      const k=getK();
      if(agents.length<2||(k.mode||'direct')==='direct'){bar.style.display='none';return}
      bar.style.display='flex';
      sel.innerHTML=agents.map(a=>`<option value="${a.id}" ${a.active?'selected':''}>${esc(a.name)}</option>`).join('');
    }

    // ── Camera ──────────────────────────────────────────
    let camStream=null,facingMode='environment',torchOn=false;

    $('cameraBtn').addEventListener('click',openCamera);

    async function openCamera(){
      $('camOverlay').classList.remove('hidden');
      try{
        camStream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode,width:{ideal:1920},height:{ideal:1080}},audio:false
        });
        $('camVideo').srcObject=camStream;
      }catch(e){showToast('Camera access denied','err');closeCamera()}
    }

    $('camShutter').addEventListener('click',()=>{
      const video=$('camVideo'),canvas=$('camCanvas');
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      const dataUrl=canvas.toDataURL('image/jpeg',0.85);
      closeCamera();
      const n=pendingFiles.filter(f=>f.type==='image').length+1;
      pendingFiles.push({name:`Photo ${n}`,dataUrl,type:'image'});
      renderFileStack();updateActionBtn();
    });

    $('camFlip').addEventListener('click',async()=>{
      facingMode=facingMode==='environment'?'user':'environment';
      if(camStream){camStream.getTracks().forEach(t=>t.stop())}
      torchOn=false;$('camTorch').classList.remove('on');
      try{
        camStream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode,width:{ideal:1920},height:{ideal:1080}},audio:false
        });
        $('camVideo').srcObject=camStream;
      }catch(e){showToast('Camera flip failed','err')}
    });

    $('camTorch').addEventListener('click',async()=>{
      if(!camStream)return;
      const track=camStream.getVideoTracks()[0];
      if(!track)return;
      try{
        torchOn=!torchOn;
        await track.applyConstraints({advanced:[{torch:torchOn}]});
        $('camTorch').classList.toggle('on',torchOn);
      }catch{showToast('Flashlight not available','err');torchOn=false}
    });

    $('camClose').addEventListener('click',closeCamera);

    function closeCamera(){
      if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
      $('camOverlay').classList.add('hidden');torchOn=false;$('camTorch').classList.remove('on');
    }



    // ── Config Import (shared by hash, file drop, paste) ──
    const CONFIG_KEYS={
      aiProvider:'aiProvider',aiKey:'aiKey',aiModel:'aiModel',
      whisperKey:'whisperKey',ttsKey:'ttsKey',ttsVoice:'ttsVoice',ttsAutoPlay:'ttsAutoPlay',
      sysPrompt:'sysPrompt',mode:'mode',
      tgToken:'tgToken',tgChatId:'tgChatId',tgEnabled:'tgEnabled',
      imageGenUrl:'imageGenUrl',imageGenKey:'imageGenKey',imageGenModel:'imageGenModel',imageGenSize:'imageGenSize'
    };

    function importConfig(cfg){
      const k=getK();
      let count=0;
      for(const[from,to]of Object.entries(CONFIG_KEYS)){
        if(cfg[from]!==undefined){k[to]=cfg[from];count++}
      }
      setK(k);
      if(cfg.agents&&Array.isArray(cfg.agents)){
        setAgents(cfg.agents);count+=cfg.agents.length;
      } else if(cfg.gwUrl&&cfg.gwToken){
        const agents=getAgents();
        agents.push({id:Date.now().toString(36),name:cfg.agentName||'Agent',url:cfg.gwUrl,token:cfg.gwToken,active:true});
        setAgents(agents);count+=2;
      }
      return count;
    }

    // URL hash fragment (#config=BASE64) never leaves the browser.
    function importFromHash(){
      const h=location.hash;
      if(!h.startsWith('#config='))return false;
      try{
        const cfg=JSON.parse(atob(h.slice(8)));
        const count=importConfig(cfg);
        history.replaceState(null,'',location.pathname);
        showToast(`Imported ${count} settings`,'ok');
        return true;
      }catch(e){console.warn('Config import failed:',e);return false}
    }

    // Export config as copyable hash URL (for agent to generate)
    function exportConfigUrl(){
      const k=getK();
      k.agents=getAgents();
      const json=JSON.stringify(k);
      return location.origin+'/#config='+btoa(json);
    }

    // ── Init ───────────────────────────────────────────
    importFromHash();
    loadUI();
    // Run onboarding if no keys set and no chat history
    setTimeout(()=>runOnboarding(),300);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
