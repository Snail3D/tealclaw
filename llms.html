<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TealClaw — Agent Context</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <style>
    :root {
      --t: 0.2s;
      --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
      --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Code', Menlo, monospace;
      --teal: #0d9488; --teal-dim: rgba(13,148,136,0.12); --teal-hover: #0f766e;
    }
    [data-theme="dark"] {
      --bg-root: #0a0f1a; --bg-1: #0e1320; --bg-card: #121928;
      --bg-hover: #1a2236; --bg-input: #0e1320;
      --border: #1e2a3e; --border-2: #2e3f5a;
      --text: #e2e8f0; --text-2: #94a3b8; --text-3: #475569;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg-root: #f1f5f9; --bg-1: #fff; --bg-card: #fff;
      --bg-hover: #f8fafc; --bg-input: #f1f5f9;
      --border: #e2e8f0; --border-2: #cbd5e1;
      --text: #0f172a; --text-2: #475569; --text-3: #94a3b8;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg-root);color:var(--text);font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}

    .topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;background:var(--bg-1);border-bottom:1px solid var(--border)}
    .logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--teal);user-select:none;text-decoration:none}
    .logo svg{width:21px;height:21px}
    .topbar-r{margin-left:auto;display:flex;align-items:center;gap:10px}
    .back-link{font-size:14px;color:var(--text-2);text-decoration:none;transition:color var(--t)}
    .back-link:hover{color:var(--teal)}

    .container{max-width:760px;margin:0 auto;padding:20px 16px 40px}

    .copy-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md)}
    .copy-bar-info{font-size:12px;color:var(--text-2)}
    .copy-bar-info code{font-family:var(--mono);font-size:11px;color:var(--teal);background:var(--teal-dim);padding:1px 6px;border-radius:3px}
    .copy-btn{padding:6px 14px;font-size:12px;font-weight:600;font-family:var(--font);background:var(--teal);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;transition:all var(--t);display:flex;align-items:center;gap:5px}
    .copy-btn:hover{background:var(--teal-hover)}
    .copy-btn svg{width:14px;height:14px}
    .copy-btn.copied{background:#22c55e}

    .content{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:24px 28px;font-size:13px;line-height:1.7}
    .content h1{font-size:18px;font-weight:700;color:var(--teal);margin:0 0 4px}
    .content h2{font-size:15px;font-weight:600;color:var(--teal);margin:24px 0 8px;padding-top:16px;border-top:1px solid var(--border)}
    .content h2:first-of-type{border-top:none;padding-top:0}
    .content h3{font-size:13px;font-weight:600;color:var(--text);margin:16px 0 6px}
    .content p{margin:0 0 10px;color:var(--text-2)}
    .content strong{color:var(--text);font-weight:600}
    .content blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--teal);background:var(--teal-dim);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text-2);font-size:12px}
    .content ul,.content ol{margin:0 0 10px;padding-left:20px;color:var(--text-2)}
    .content li{margin-bottom:3px}
    .content li::marker{color:var(--teal)}
    .content code{font-family:var(--mono);font-size:11px;padding:1px 5px;background:var(--teal-dim);color:var(--teal);border-radius:3px}
    .content pre{margin:8px 0 12px;padding:12px 14px;background:var(--bg-root);border:1px solid var(--border);border-radius:var(--r-md);overflow-x:auto}
    .content pre code{display:block;padding:0;background:none;color:var(--text);font-size:11px;line-height:1.5}

    .footer{text-align:center;padding:20px 0;font-size:10px;color:var(--text-3)}
    .footer a{color:var(--teal);text-decoration:none}

    @media(max-width:480px){
      .content{padding:16px}
      .copy-bar{flex-direction:column;gap:10px;align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      TealClaw
    </a>
    <div class="topbar-r">
      <a href="/" class="back-link">&larr; Back to chat</a>
    </div>
  </div>

  <div class="container">
    <div class="copy-bar">
      <div class="copy-bar-info">Agent context file &mdash; raw text at <code>/llms.txt</code></div>
      <button class="copy-btn" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>

    <div class="content" id="content">Loading...</div>

    <div class="footer">
      <a href="/">TealClaw</a> &mdash; your keys never leave your browser.
    </div>
  </div>

  <script>
    const theme = localStorage.getItem('tc-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);

    let rawText = '';

    function renderMarkdown(md) {
      // Simple markdown-to-HTML (good enough for this structured doc)
      let html = md
        // Code blocks (``` ... ```)
        .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
          `<pre><code>${code.replace(/</g,'&lt;').replace(/>/g,'&gt;').trimEnd()}</code></pre>`)
        // Headers
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // Blockquotes
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        // Bold + inline code (do bold first so ** inside code is safe)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Unordered lists
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Ordered lists
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

      // Wrap consecutive <li> in <ul>
      html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
      // Merge consecutive blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');
      // Paragraphs: wrap remaining loose lines
      html = html.replace(/^(?!<[hupbl]|$)(.+)$/gm, '<p>$1</p>');
      // Clean up blank lines
      html = html.replace(/\n{2,}/g, '\n');

      return html;
    }

    async function load() {
      try {
        const res = await fetch('/llms.txt');
        rawText = await res.text();
        document.getElementById('content').innerHTML = renderMarkdown(rawText);
      } catch (e) {
        document.getElementById('content').innerHTML = '<p>Failed to load llms.txt</p>';
      }
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyBtn');
      try {
        await navigator.clipboard.writeText(rawText);
        btn.classList.add('copied');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
        }, 2000);
      } catch {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = rawText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.classList.add('copied');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy'; }, 2000);
      }
    });

    load();
  </script>
</body>
</html>
